packages:
  - packages/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@duckdb/node-api@1.5.6-r.1'
  - '@duckdb/node-bindings-darwin-arm64@1.5.6-r.1'
  - '@duckdb/node-bindings-darwin-x64@1.5.6-r.1'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.6-r.1'
  - '@duckdb/node-bindings-linux-arm64@1.5.6-r.1'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.6-r.1'
  - '@duckdb/node-bindings-linux-x64@1.5.6-r.1'
  - '@duckdb/node-bindings-win32-arm64@1.5.6-r.1'
  - '@duckdb/node-bindings-win32-x64@1.5.6-r.1'
  - '@duckdb/node-bindings@1.5.6-r.1'
