<!-- The saved cohorts, and only when there are some.
     "This dashboard" and "Whole population" are not here: they always exist,
     they follow the controls above, and a chip for each of them was two rows of
     furniture on every dashboard that had no cohorts at all. They are still
     offered wherever a cohort is *chosen* -- a panel's "Compare with…" menu. -->
@if (saved().length > 0) {
  <div
    class="flex flex-wrap items-center gap-2 border-t border-border pt-3"
    data-testid="cohort-bar"
    aria-label="Saved cohorts"
  >
    <span class="field-label mb-0">Cohorts</span>

    @for (entry of saved(); track entry.cohort.id) {
      <!-- 28px, and the chip itself is the edit affordance: a chip with three
           buttons on it is a toolbar, and the one a reader reaches for is
           "open this". The close icon stays separate because deleting is not editing. -->
      <span
        class="chip chip-quiet h-7 gap-1.5 pr-1"
        [attr.data-testid]="'cohort-chip-' + entry.cohort.id"
        [attr.data-cohort-name]="entry.cohort.name"
      >
        @if (entry.editable) {
          <button
            type="button"
            class="flex min-w-0 items-center gap-1.5 text-ink-2 hover:text-ink"
            (click)="edit(entry)"
            [attr.aria-label]="'Edit ' + entry.cohort.name"
            [attr.data-testid]="'cohort-edit-' + entry.cohort.id"
            [matTooltip]="tip(entry)"
          >
            <span
              class="inline-block h-2.5 w-2.5 flex-none rounded-chip"
              [style.background-color]="entry.color"
              aria-hidden="true"
            ></span>
            <span class="truncate">{{ entry.cohort.name }}</span>
          </button>
        } @else {
          <span class="flex min-w-0 items-center gap-1.5 text-ink-2" [matTooltip]="tip(entry)">
            <span
              class="inline-block h-2.5 w-2.5 flex-none rounded-chip"
              [style.background-color]="entry.color"
              aria-hidden="true"
            ></span>
            <span class="truncate">{{ entry.cohort.name }}</span>
          </span>
        }
        <button
          type="button"
          class="flex-none px-1 text-ink-3 hover:text-ink"
          (click)="entry.editable ? remove(entry.cohort) : clearStudy()"
          [attr.aria-label]="'Remove ' + entry.cohort.name"
          [attr.data-testid]="'cohort-remove-' + entry.cohort.id"
          matTooltip="Remove it from the dashboard and from every comparison"
        >
          <lucide-icon
            class="icon-16"
            name="x"
            color="currentColor"
            [size]="16"
            [strokeWidth]="1.75"
            aria-hidden="true"
          />
        </button>
      </span>
    }

    <button
      type="button"
      class="btn btn-quiet"
      (click)="create()"
      [disabled]="full()"
      data-testid="cohort-add"
      matTooltip="Build a cohort by hand instead"
    >
      Add one by hand&hellip;
    </button>
  </div>
}
